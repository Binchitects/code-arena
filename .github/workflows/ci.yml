name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: osx-arm64, os: macos-15 }
          - { name: osx-x64, os: macos-15-intel }
          - { name: win-x64, os: windows-2025 }
          - { name: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: bubblewrap, for the sandbox's tests
        if: startsWith(matrix.name, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo test --workspace --locked
      - name: The program runs
        shell: bash
        run: cargo run --locked -q -p ca-cli -- version
      - name: The chat in a real terminal
        if: "!startsWith(matrix.name, 'win-')"
        run: |
          cargo build --locked -q -p ca-cli
          python3 tests/pty/chat_approval.py "$PWD/target/debug/code-arena"
          python3 tests/pty/chat_jobs.py "$PWD/target/debug/code-arena"
          python3 tests/pty/chat_sync.py "$PWD/target/debug/code-arena"
          python3 tests/pty/chat_typed.py "$PWD/target/debug/code-arena"
          python3 tests/pty/chat_commit.py "$PWD/target/debug/code-arena"
      - name: The sandbox, where the runner can make one
        if: "!startsWith(matrix.name, 'win-')"
        shell: bash
        run: |
          if [ "$(uname)" = Darwin ] || bwrap --ro-bind / / --dev /dev --proc /proc -- true 2>/dev/null; then
            python3 tests/pty/sandbox_check.py "$PWD/target/debug/code-arena"
          else
            echo "bubblewrap cannot make a sandbox on this runner: skipped"
          fi
