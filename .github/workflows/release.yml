name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # The native window needs the system's C library (to open the GPU's and the display's libraries), so the
          # Linux packages with it are built on the oldest runner (glibc 2.35); the static ones serve the IDE to a
          # browser and run anywhere.
          - { rid: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { rid: linux-x64-static, os: ubuntu-24.04, target: x86_64-unknown-linux-musl, flags: --no-default-features }
          - { rid: linux-arm64-static, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, flags: --no-default-features }
          - { rid: osx-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { rid: osx-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { rid: win-x64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { rid: win-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: musl for a static Linux binary
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The IDE's page
        working-directory: web
        run: npm ci && npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rid }}
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p ca-cli ${{ matrix.flags }} --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }} ${{ matrix.rid }} "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum code-arena-* > SHA256SUMS && cat SHA256SUMS
      - name: The tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml's version is not $version" >&2; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/changelog-section.sh "$version" > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Code Arena $version" --notes-file notes.md --verify-tag --latest
          fi
