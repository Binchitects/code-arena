[package]
name = "ca-native"
description = "The IDE as a native app, drawn on the GPU (Floem): the same driver and messages as the browser page."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
# Kept for the parts to come (pictures and attachments as data, ignore and search patterns, find and replace, the
# compare editor): each is in the lock file already, so no part has to change this file.
base64 = "0.22"
ca-themes.workspace = true
crossbeam-channel = "0.5"
floem = "0.2"
# Floem's own drawing (fills, strokes, text) for the views this crate paints itself: the editor's margin, the
# overview ruler. Floem draws with it and does not give its trait out.
floem_renderer = "0.2"
globset.workspace = true
im = "15.1"
regex.workspace = true
serde_json.workspace = true
similar.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio.workspace = true

[lints]
workspace = true
