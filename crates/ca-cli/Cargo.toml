[package]
name = "ca-cli"
description = "Code Arena: the code-arena program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "code-arena"

[[bin]]
name = "code-arena"
path = "src/main.rs"

[features]
# The native window (Floem, on the GPU). Left out of the static builds, whose `ide` serves the browser page.
default = ["native"]
native = ["dep:ca-native"]

[dependencies]
ca-native = { workspace = true, optional = true }
ca-server.workspace = true
ca-pty.workspace = true
ignore.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ca-agent.workspace = true
ca-arena.workspace = true
ca-core.workspace = true
ca-llm.workspace = true
ca-memory.workspace = true
ca-net.workspace = true
ca-mcp.workspace = true
ca-session.workspace = true
ca-sync.workspace = true
ca-settings.workspace = true
ca-tools.workspace = true
ca-workspace.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
unicode-width.workspace = true
# For the IDE's areas (`ide_*.rs`): diffs, globs and patterns, pictures as text, checksums and signatures, archives,
# walks.
similar.workspace = true
globset.workspace = true
regex.workspace = true
zip.workspace = true
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"
# A newer Code Arena's signature: the code-signing certificate's chain to the Arena's CA, and its key's signature.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
walkdir = "2"
# A small copy of a picture attached to a message, for its chip (the native window's own features).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tokio-tungstenite = "0.26"
futures-util.workspace = true

[lints]
workspace = true
