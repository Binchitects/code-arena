[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Binchitects/code-arena"
rust-version = "1.88"

[workspace.dependencies]
ca-core = { path = "crates/ca-core" }
ca-server = { path = "crates/ca-server" }
ca-pty = { path = "crates/ca-pty" }
ca-themes = { path = "crates/ca-themes" }
ca-native = { path = "crates/ca-native" }
ca-settings = { path = "crates/ca-settings" }
ca-net = { path = "crates/ca-net" }
ca-arena = { path = "crates/ca-arena" }
ca-llm = { path = "crates/ca-llm" }
ca-mcp = { path = "crates/ca-mcp" }
ca-tools = { path = "crates/ca-tools" }
ca-agent = { path = "crates/ca-agent" }
ca-workspace = { path = "crates/ca-workspace" }
ca-session = { path = "crates/ca-session" }
ca-sync = { path = "crates/ca-sync" }
ca-memory = { path = "crates/ca-memory" }

anyhow = "1"
async-trait = "0.1"
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
futures-util = "0.3"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "cookies", "rustls-tls-native-roots"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "time", "sync", "signal"] }
unicode-width = "0.2"
url = "2"
wiremock = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"

# The native window's toolkit (Floem: its layout, text and drawing) is far too slow unoptimised to judge or use,
# so dependencies are optimised in development builds too; the workspace's own crates stay quick to build.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ca-native]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
